[package]
name = "feed-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Poll RSS/Atom feeds listed in an OPML file and index their entries into PostgreSQL"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
feed-rs = "3"
hex = "0.4"
html2text = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "stream"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "chrono", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
# Not used directly. sqlx-postgres 0.9.0 depends on whoami without default features, which
# builds its stub backend: with PGUSER unset it would connect as "anonymous" instead of the
# OS user (the libpq default). Enabling "std" here selects the real backend.
whoami = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3"
wiremock = "0.6"
